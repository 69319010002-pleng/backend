<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการโครงการสิ่งประดิษฐ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 py-3.5 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="login.html" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition">
                    <i class="fa-solid fa-lightbulb text-slate-950 text-xl"></i>
                </div>
                <span class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">ระบบจัดการโครงการสิ่งประดิษฐ์</span>
            </a>
            <div class="flex items-center gap-1 sm:gap-2 text-sm font-medium">
                <a href="login.html" class="bg-indigo-600 text-white px-3.5 py-2 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center gap-2"><i class="fa-solid fa-user-lock text-xs"></i> <span>เข้าสู่ระบบ</span></a>
                <a href="drive.html" class="hover:bg-slate-800 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl transition flex items-center gap-2"><i class="fa-solid fa-folder-open text-xs"></i> <span>คลังไฟล์</span></a>
                <a href="projects.html" class="hover:bg-slate-800 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl transition flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-xs"></i> <span>ส่งโครงการ</span></a>
                <a href="/api-docs" target="_blank" class="border border-slate-700 hover:border-slate-500 hover:bg-slate-800 text-slate-300 px-3 py-2 rounded-xl transition flex items-center gap-2 ml-2"><i class="fa-solid fa-code text-indigo-400 text-xs"></i> <span class="hidden sm:inline">Swagger API</span></a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-md w-full mx-auto px-4 py-12 flex-1 flex flex-col justify-center">
        <div class="bg-slate-800/60 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-xl">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">เข้าสู่ระบบ</h1>
                <p class="text-xs text-slate-400">กรอกข้อมูลเพื่อเข้าใช้งานระบบบริหารจัดการโครงการ</p>
            </div>

            <form class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" placeholder="ระบุชื่อผู้ใช้งาน" required class="w-full px-4 py-2.5 text-sm bg-slate-900/80 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none text-white transition placeholder-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">รหัสผ่าน (Password)</label>
                    <input type="password" placeholder="••••••••" required class="w-full px-4 py-2.5 text-sm bg-slate-900/80 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none text-white transition placeholder-slate-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-emerald-600/30 transition duration-200 mt-2">
                    เข้าสู่ระบบ
                </button>
            </form>

            <div class="border-t border-slate-700/60 pt-4 text-center text-xs text-slate-400">
                ยังไม่มีบัญชีผู้ใช้งาน? <a href="register.html" class="text-indigo-400 hover:text-indigo-300 font-semibold underline ml-1">สมัครสมาชิกที่นี่</a>
            </div>
        </div>
    </main>

    <footer class="py-6 border-t border-slate-800 text-center text-xs text-slate-500">
        &copy; 2026 ระบบจัดการโครงการสิ่งประดิษฐ์ — All Rights Reserved.
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            alert('เข้าสู่ระบบสำเร็จ!');
            window.location.href = 'drive.html';
        }
    </script>
</body>
</html>
